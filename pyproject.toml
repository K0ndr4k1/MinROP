[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minirop"
version = "1.0"
description = "Small ELF64 x86-64 gadget analysis and finite constraint search tool"
requires-python = ">=3.10"
dependencies = ["pyelftools>=0.31,<1", "capstone>=5,<6", "z3-solver>=4.13,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
minirop = "minirop.cli:main"

[tool.setuptools.packages.find]
include = ["minirop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
